name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Project
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/java/com/example/autoclaimer

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoClaimer"
          include ':app'
          EOF

          # 2. build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.autoclaimer'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.autoclaimer"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # 4. strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">0.1s Claimer</string>
          </resources>
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingClaimerService" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 6. MainActivity.java
          cat << 'EOF' > app/src/main/java/com/example/autoclaimer/MainActivity.java
          package com.example.autoclaimer;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Button btn = new Button(this);
                  btn.setText("START 0.1s CLAIMER");
                  btn.setBackgroundColor(Color.parseColor("#FF6600"));
                  btn.setTextColor(Color.WHITE);
                  btn.setTextSize(16f);
                  btn.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivity(intent);
                          Toast.makeText(this, "Overlay Allow Karein", Toast.LENGTH_SHORT).show();
                      } else {
                          startService(new Intent(this, FloatingClaimerService.class));
                          finish();
                      }
                  });
                  setContentView(btn);
              }
          }
          EOF

          # 7. FloatingClaimerService.java
          cat << 'EOF' > app/src/main/java/com/example/autoclaimer/FloatingClaimerService.java
          package com.example.autoclaimer;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.util.Arrays;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;
          import okhttp3.ConnectionPool;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class FloatingClaimerService extends Service {
              private WindowManager wm;
              private View floatingView;
              private EditText etCode;
              private TextView tvStatus;
              private Button btnAuto;
              private boolean isAutoOn = false;
              private final ExecutorService executor = Executors.newFixedThreadPool(20);
              private final OkHttpClient client = new OkHttpClient.Builder()
                      .connectionPool(new ConnectionPool(50, 10, TimeUnit.MINUTES))
                      .connectTimeout(1, TimeUnit.SECONDS)
                      .readTimeout(1, TimeUnit.SECONDS)
                      .retryOnConnectionFailure(false)
                      .build();

              private final List<String[]> accounts = Arrays.asList(
                      new String[]{"YOUR_AUTH_TOKEN_1", "varanasi91.com"},
                      new String[]{"YOUR_AUTH_TOKEN_2", "559874.com"},
                      new String[]{"YOUR_AUTH_TOKEN_3", "bdggame.com"}
              );

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  startNotif();
                  initUI();
                  preWarm();
                  initClipboard();
              }

              private void preWarm() {
                  for (String[] acc : accounts) {
                      executor.execute(() -> {
                          try {
                              Request r = new Request.Builder().url("https://" + acc[1] + "/").head().build();
                              client.newCall(r).execute().close();
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void initUI() {
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  float d = getResources().getDisplayMetrics().density;
                  int dp12 = (int)(12 * d);
                  int dp8 = (int)(8 * d);
                  int dp42 = (int)(42 * d);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp12, dp12, dp12, dp12);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#161622"));
                  bg.setCornerRadius(10 * d);
                  root.setBackground(bg);

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  TextView title = new TextView(this);
                  title.setText("⚡ 0.1s ULTRA CLAIMER");
                  title.setTextColor(Color.parseColor("#00FF66"));
                  title.setTextSize(13f);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  title.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));

                  Button btnClose = new Button(this);
                  btnClose.setText("✕");
                  btnClose.setTextColor(Color.WHITE);
                  btnClose.setBackgroundColor(Color.parseColor("#FF3B30"));
                  btnClose.setLayoutParams(new LinearLayout.LayoutParams((int)(36 * d), (int)(36 * d)));
                  btnClose.setOnClickListener(v -> stopSelf());

                  header.addView(title);
                  header.addView(btnClose);
                  root.addView(header);

                  etCode = new EditText(this);
                  etCode.setHint("Paste Code...");
                  etCode.setHintTextColor(Color.parseColor("#777788"));
                  etCode.setTextColor(Color.WHITE);
                  etCode.setTextSize(13f);
                  GradientDrawable bgEd = new GradientDrawable();
                  bgEd.setColor(Color.parseColor("#232336"));
                  bgEd.setCornerRadius(6 * d);
                  etCode.setBackground(bgEd);
                  LinearLayout.LayoutParams lpEd = new LinearLayout.LayoutParams(-1, (int)(44 * d));
                  lpEd.topMargin = dp8;
                  etCode.setLayoutParams(lpEd);
                  root.addView(etCode);

                  LinearLayout btns = new LinearLayout(this);
                  btns.setOrientation(LinearLayout.HORIZONTAL);
                  LinearLayout.LayoutParams lpBtns = new LinearLayout.LayoutParams(-1, -2);
                  lpBtns.topMargin = dp8;
                  btns.setLayoutParams(lpBtns);

                  btnAuto = new Button(this);
                  btnAuto.setText("AUTO: OFF");
                  btnAuto.setTextColor(Color.WHITE);
                  btnAuto.setBackgroundColor(Color.parseColor("#3A3A4C"));
                  btnAuto.setLayoutParams(new LinearLayout.LayoutParams(0, dp42, 1f));
                  btnAuto.setOnClickListener(v -> {
                      isAutoOn = !isAutoOn;
                      btnAuto.setText(isAutoOn ? "AUTO: ON 🔥" : "AUTO: OFF");
                      btnAuto.setBackgroundColor(isAutoOn ? Color.parseColor("#00AA44") : Color.parseColor("#3A3A4C"));
                  });

                  Button btnFire = new Button(this);
                  btnFire.setText("FIRE 🔥");
                  btnFire.setTextColor(Color.WHITE);
                  btnFire.setBackgroundColor(Color.parseColor("#FF6600"));
                  LinearLayout.LayoutParams lpFire = new LinearLayout.LayoutParams(0, dp42, 1.2f);
                  lpFire.leftMargin = (int)(6 * d);
                  btnFire.setLayoutParams(lpFire);
                  btnFire.setOnClickListener(v -> {
                      String code = etCode.getText().toString().trim();
                      if (!code.isEmpty()) fireCode(code);
                  });

                  btns.addView(btnAuto);
                  btns.addView(btnFire);
                  root.addView(btns);

                  tvStatus = new TextView(this);
                  tvStatus.setText("Status: Sockets Ready");
                  tvStatus.setTextColor(Color.parseColor("#00E5FF"));
                  tvStatus.setTextSize(11f);
                  LinearLayout.LayoutParams lpSt = new LinearLayout.LayoutParams(-1, -2);
                  lpSt.topMargin = (int)(6 * d);
                  tvStatus.setLayoutParams(lpSt);
                  root.addView(tvStatus);

                  floatingView = root;

                  int type = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ?
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE;
                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                          (int)(320 * d), WindowManager.LayoutParams.WRAP_CONTENT, type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.START;
                  params.x = (int)(30 * d);
                  params.y = (int)(80 * d);

                  wm.addView(floatingView, params);

                  header.setOnTouchListener(new View.OnTouchListener() {
                      int initX, initY;
                      float touchX, touchY;
                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              initX = params.x; initY = params.y;
                              touchX = e.getRawX(); touchY = e.getRawY();
                              return true;
                          } else if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              params.x = initX + (int)(e.getRawX() - touchX);
                              params.y = initY + (int)(e.getRawY() - touchY);
                              wm.updateViewLayout(floatingView, params);
                              return true;
                          }
                          return false;
                      }
                  });
              }

              private void initClipboard() {
                  ClipboardManager cb = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  if (cb != null) {
                      cb.addPrimaryClipChangedListener(() -> {
                          try {
                              ClipData data = cb.getPrimaryClip();
                              if (data != null && data.getItemCount() > 0) {
                                  String text = data.getItemAt(0).getText().toString().trim();
                                  if (text.length() == 32) {
                                      etCode.setText(text);
                                      if (isAutoOn) fireCode(text);
                                  }
                              }
                          } catch (Exception ignored) {}
                      });
                  }
              }

              private void fireCode(String code) {
                  long t0 = System.currentTimeMillis();
                  tvStatus.setText("⚡ Firing " + accounts.size() + " IDs...");
                  byte[] payload = ("{\"giftCode\":\"" + code + "\"}").getBytes();
                  MediaType json = MediaType.parse("application/json; charset=utf-8");

                  for (String[] acc : accounts) {
                      executor.execute(() -> {
                          try {
                              Request req = new Request.Builder()
                                      .url("https://" + acc[1] + "/api/web/v1/gift/receive")
                                      .addHeader("Authorization", "Bearer " + acc[0])
                                      .addHeader("Connection", "keep-alive")
                                      .post(RequestBody.create(payload, json))
                                      .build();
                              Response res = client.newCall(req).execute();
                              res.close();
                          } catch (Exception ignored) {}
                      });
                  }

                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      long dur = System.currentTimeMillis() - t0;
                      tvStatus.setText("🔥 Done in " + dur + "ms | Hit: " + accounts.size() + " IDs");
                  }, 100);
              }

              private void startNotif() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel("ch1", "Claimer", NotificationManager.IMPORTANCE_LOW);
                      ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
                      Notification n = new Notification.Builder(this, "ch1").setContentTitle("0.1s Claimer Running").setSmallIcon(android.R.drawable.ic_menu_compass).build();
                      startForeground(101, n);
                  }
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingView != null && wm != null) wm.removeView(floatingView);
                  executor.shutdown();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClaimer-0.1s-APK
          path: app/build/outputs/apk/debug/*.apk
          
